name: CI/CD

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 5 * * 1'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: [php, proxy, static]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Build
        run: |
          docker buildx build \
            --pull --no-cache \
            --platform linux/amd64 \
            --output type=docker \
            --tag kooldev/nginx:${{ matrix.version }} \
            ${{ matrix.version }}

      - name: Tests
        run: bash tests/smoke.sh "${{ matrix.version }}" "kooldev/nginx:${{ matrix.version }}"

      - name: Scan image
        uses: anchore/scan-action@8576240a41341d866dbd7ebc72cd9fc0ef023f54 # v7.4.2
        with:
          image: kooldev/nginx:${{ matrix.version }}
          grype-version: v0.121.3
          severity-cutoff: high
          only-fixed: false
          output-format: json
          output-file: grype-${{ matrix.version }}.json

      - name: Retain vulnerability report
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: grype-${{ matrix.version }}
          path: grype-${{ matrix.version }}.json
          if-no-files-found: warn

      - name: Login to DockerHub
        uses: docker/login-action@v4.4.0
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master' && github.repository == 'kool-dev/docker-nginx'
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push to DockerHub
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master' && github.repository == 'kool-dev/docker-nginx'
        run: docker push kooldev/nginx:${{ matrix.version }}
