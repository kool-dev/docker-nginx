name: CI/CD
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 5 * * 1'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  checks:
    runs-on: ubuntu-24.04
    outputs:
      tags: ${{ steps.tags.outputs.tags }}
    steps:
      - uses: actions/checkout@v7
      - name: Check generated contexts
        run: |
          docker run --rm -v "$PWD:/app" fireworkweb/fwd:v1.0 fwd template
          git diff --exit-code
      - id: tags
        run: echo "tags=$(jq -c '[.builds[].name]' fwd-template.json)" >> "$GITHUB_OUTPUT"
  build:
    needs: checks
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        version: [php, proxy, static]
        platform:
          - {arch: amd64, runner: ubuntu-24.04}
    steps:
      - uses: actions/checkout@v7
      - uses: kool-dev/action/image-build@c1a0de73a81d63b9b1da74001afd60aa5573470a
        with:
          arch: ${{ matrix.platform.arch }}
      - name: Build fresh image
        id: image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.version }}
          platforms: linux/${{ matrix.platform.arch }}
          pull: true
          no-cache: true
          load: true
          provenance: false
          tags: kooldev/nginx:${{ matrix.version }}
      - name: Smoke tests
        env:
          VARIANT: ${{ matrix.version }}
          IMAGE: ${{ steps.image.outputs.imageid }}
        run: bash tests/smoke.sh "$VARIANT" "$IMAGE"
      - name: Scan tested image
        uses: anchore/scan-action@8576240a41341d866dbd7ebc72cd9fc0ef023f54 # v7.4.2
        with:
          image: kooldev/nginx:${{ matrix.version }}
          grype-version: v0.121.3
          severity-cutoff: high
          only-fixed: false
          output-format: json
          output-file: grype-${{ matrix.version }}.json
      - name: Retain vulnerability report
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: grype-${{ matrix.version }}
          path: grype-${{ matrix.version }}.json
          if-no-files-found: warn
      - uses: kool-dev/action/image-stage@c1a0de73a81d63b9b1da74001afd60aa5573470a
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master' && github.repository == 'kool-dev/docker-nginx'
        with:
          canonical-repository: kool-dev/docker-nginx
          default-branch: master
          repository: kooldev/nginx
          arch: ${{ matrix.platform.arch }}
          group: ${{ matrix.version }}
          images: '[{"tag":"${{ matrix.version }}","id":"${{ steps.image.outputs.imageid }}"}]'
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
  publish:
    needs: [checks, build]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master' && github.repository == 'kool-dev/docker-nginx'
    uses: kool-dev/action/.github/workflows/image-publish.yml@c1a0de73a81d63b9b1da74001afd60aa5573470a
    with:
      canonical-repository: kool-dev/docker-nginx
      default-branch: master
      repository: kooldev/nginx
      tags: ${{ needs.checks.outputs.tags }}
      architectures: '["amd64"]'
      tooling-ref: c1a0de73a81d63b9b1da74001afd60aa5573470a
    secrets:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
